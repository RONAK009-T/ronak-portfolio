services:
  - type: web
    name: ronak-portfolio
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'gunicorn --chdir backend config.wsgi:application'
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: ALLOWED_HOSTS
        value: '.onrender.com,localhost,127.0.0.1'
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB_NAME
        value: ronak_portfolio
